name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format clang-tidy libcurl4-openssl-dev libmosquitto-dev

      - name: Check clang-format
        run: |
          clang-format --dry-run --Werror src/weather_clock.cc include/logger.hh include/simple_json.hh

      - name: Run clang-tidy
        run: |
          clang-tidy src/weather_clock.cc \
            -- -std=c++17 -I include -I matrix/include \
               -DNDEBUG
