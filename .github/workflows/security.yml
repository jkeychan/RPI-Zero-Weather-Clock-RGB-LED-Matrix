name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 6am UTC

jobs:
  actionlint:
    name: Actionlint - Workflow Syntax Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # ratchet:jaxxstorm/action-install-gh-release@v2 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          repo: rhysd/actionlint
          tag: v1.7.12

      - name: Run actionlint
        run: actionlint

  zizmor:
    name: Zizmor - Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          persist-credentials: false

      - name: Install zizmor
        id: install-zizmor
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # ratchet:jaxxstorm/action-install-gh-release@v2 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          repo: zizmorcore/zizmor
          tag: latest
          rename-to: zizmor

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if command -v zizmor >/dev/null 2>&1; then
            zizmor --format sarif .github/workflows > zizmor.sarif
          elif [ -f "${HOME}/.local/bin/zizmor" ]; then
            "${HOME}/.local/bin/zizmor" --format sarif .github/workflows > zizmor.sarif
          else
            ./zizmor --format sarif .github/workflows > zizmor.sarif
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # ratchet:github/codeql-action/upload-sarif@v4 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  ratchet:
    name: Ratchet - Version Pinning Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          persist-credentials: false

      - name: Install ratchet
        id: install-ratchet
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # ratchet:jaxxstorm/action-install-gh-release@v2 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          repo: sethvargo/ratchet
          tag: latest

      - name: Check all workflows are pinned
        run: |
          if command -v ratchet >/dev/null 2>&1; then
            RATCHET_CMD="ratchet"
          elif [ -f "${HOME}/.local/bin/ratchet" ]; then
            RATCHET_CMD="${HOME}/.local/bin/ratchet"
          else
            RATCHET_CMD="./ratchet"
          fi
          find .github/workflows -name "*.yml" -o -name "*.yaml" | while read -r file; do
            echo "Checking: ${file}"
            "${RATCHET_CMD}" check "${file}"
          done
