name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libmosquitto-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # ratchet:github/codeql-action/init@v4 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          make -C matrix/lib
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # ratchet:github/codeql-action/analyze@v4 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          category: /language:c-cpp
