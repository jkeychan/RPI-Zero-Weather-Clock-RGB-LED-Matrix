name: Build and Release ARMv6 Binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Debian's armhf cross toolchain and libraries are ARMv7 (Thumb-2) whatever
    # -march says, so the binary segfaults on a Pi Zero W. Build natively in a
    # Raspbian (ARMv6) bookworm rootfs under QEMU instead.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          submodules: recursive
          persist-credentials: false

      - name: Create Raspbian bookworm rootfs
        env:
          RASPBIAN_KEY_FPR: A0DA38D0D76E8B5D638872819165938D90FDDD2E
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static binfmt-support
          curl -fsSL https://archive.raspbian.org/raspbian.public.key -o raspbian.key
          gpg --show-keys --with-colons raspbian.key | grep -q "^fpr:::::::::${RASPBIAN_KEY_FPR}:"
          gpg --dearmor -o raspbian.gpg raspbian.key
          sudo debootstrap --arch=armhf --variant=minbase --keyring="$PWD/raspbian.gpg" \
            --include=build-essential,libcurl4-openssl-dev,libmosquitto-dev \
            bookworm /rootfs http://raspbian.raspberrypi.com/raspbian

      - name: Build rgb_display natively for ARMv6
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /rootfs/src
          # matrix/config.mk uses -march=native, which under QEMU means a NEON-capable
          # CPU, not the Zero W's ARM1176.
          sudo chroot /rootfs sh -c "cd /src && make -C matrix/lib -j$(nproc) CPU_ARCH_FLAGS='-mcpu=arm1176jzf-s' && make"
          cp /rootfs/src/rgb_display .
          file rgb_display

      - name: Require ARMv6 code
        run: |
          readelf -A rgb_display | tee attrs.txt
          grep -q 'Tag_CPU_arch: v6$' attrs.txt
          grep -q 'Tag_THUMB_ISA_use: Thumb-1' attrs.txt
          # LTO can emit NEON without changing the attributes above. In ARM mode
          # every NEON encoding starts with f2/f3/f4; ARMv6 has none.
          sudo cp rgb_display /rootfs/tmp/
          sudo chroot /rootfs objdump -d /tmp/rgb_display \
            | awk '$2 ~ /^f[234][0-9a-f]{6}$/ && $3 != ".word"' > neon.txt
          if [ -s neon.txt ]; then head neon.txt; exit 1; fi

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.1 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          name: rgb_display
          path: rgb_display

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.1 zizmor: ignore[ref-version-mismatch] pin managed by ratchet, not zizmor
        with:
          name: rgb_display

      - name: Verify binary
        run: |
          file rgb_display
          objdump -p rgb_display | grep GLIBC | sort -t_ -k3 -V | tail -3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > release-notes.md << NOTES
          Precompiled ARMv6 binary for Raspberry Pi Zero W.
          Requires **Raspberry Pi OS Bookworm** (Debian 12) or later.

          **Fresh install:**
          \`\`\`bash
          git clone https://github.com/${REPOSITORY}.git ~/Documents/Code/RGB-Display
          cd ~/Documents/Code/RGB-Display
          cp sample-config.ini config.ini && vi config.ini
          bash deploy/install.sh
          wget https://github.com/${REPOSITORY}/releases/download/${REF_NAME}/rgb_display
          chmod +x rgb_display
          sudo apt install libmosquitto1 -y
          sudo systemctl enable --now rgb_display.service
          \`\`\`

          **Update binary only:**
          \`\`\`bash
          cd ~/Documents/Code/RGB-Display
          sudo systemctl stop rgb_display.service
          wget -O rgb_display https://github.com/${REPOSITORY}/releases/download/${REF_NAME}/rgb_display
          chmod +x rgb_display
          sudo apt install libmosquitto1 -y
          sudo systemctl start rgb_display.service
          \`\`\`

          See [BUILDING.md](https://github.com/${REPOSITORY}/blob/main/BUILDING.md) to build from source.
          NOTES
          gh release create "${REF_NAME}" \
            --title "${REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            rgb_display
